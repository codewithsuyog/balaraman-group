# Checks every link on the Resources page once a month and opens an issue
# listing any that are broken. Publisher sites often block bots (403), so 403 counts as OK.
name: Check resource links

on:
  schedule:
    - cron: "0 3 1 * *"   # 03:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,206,403,429 --timeout 30 --max-retries 2 app/resources.ts
          fail: false

      - name: Open an issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links on the Resources page
          content-filepath: ./lychee/out.md
